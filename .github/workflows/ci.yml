name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The redis package holds integration tests that assert against real server
    # semantics (Lua scripts, key expiry). Without a server they skip, so CI
    # provisions one in order to actually exercise them.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOFAULT_REDIS_ADDR: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build -o gofault ./cmd/gofault

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: golangci-lint run ./...

  release:
    runs-on: ubuntu-latest
    needs: [test, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o gofault-linux-amd64 ./cmd/gofault
          GOOS=darwin GOARCH=amd64 go build -o gofault-darwin-amd64 ./cmd/gofault
          GOOS=darwin GOARCH=arm64 go build -o gofault-darwin-arm64 ./cmd/gofault
          GOOS=windows GOARCH=amd64 go build -o gofault-windows-amd64.exe ./cmd/gofault

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            gofault-linux-amd64
            gofault-darwin-amd64
            gofault-darwin-arm64
            gofault-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
