name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The redis package holds integration tests that assert against real server
    # semantics (Lua scripts, key expiry). Without a server they skip, so CI
    # provisions one in order to actually exercise them.
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      GOFAULT_REDIS_ADDR: 127.0.0.1:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run tests
        run: go test ./... -race -coverprofile=coverage.out

      # Fails on declared-but-inert code: exported struct fields nothing reads,
      # and function parameters that are accepted but never used. Nine shipped
      # that way, two with security consequences (static.FollowSymLinks left
      # symlink escapes open, ipfilter.Mode silently downgraded an allow list).
      # The compiler and go vet are both silent about both classes.
      - name: Guard against inert declarations
        run: |
          go test ./internal/deadfield/ -run TestNoDeadConfigFields -v
          go test ./internal/deadfield/ -run TestNoUnusedParameters -v

      - name: Display coverage
        run: go tool cover -func=coverage.out

      - name: Build
        run: go build -o gofault ./cmd/gofault

  # testapp3 is a separate module, so `go test ./...` from the repo root never
  # reaches it and it silently rotted into a non-compiling state. Build and vet
  # every nested module explicitly.
  submodules:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [ testapp3 ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build and vet
        working-directory: ${{ matrix.module }}
        run: |
          go build ./...
          go vet ./...

  # Integration tests run against real database servers. The DSN the framework
  # builds and the pool settings it applies cannot be validated against SQLite,
  # and comparing a DSN as a string proves nothing about whether a driver can
  # parse it.
  integration:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: gofault
          MYSQL_USER: gofault
          MYSQL_PASSWORD: gofault
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ugofault -pgofault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gofault
          POSTGRES_USER: gofault
          POSTGRES_PASSWORD: gofault
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gofault"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      GOFAULT_MYSQL_HOST: 127.0.0.1
      GOFAULT_MYSQL_PORT: 3306
      GOFAULT_MYSQL_PASSWORD: gofault
      GOFAULT_POSTGRES_HOST: 127.0.0.1
      GOFAULT_POSTGRES_PORT: 5432
      GOFAULT_POSTGRES_USER: gofault
      GOFAULT_POSTGRES_PASSWORD: gofault

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Integration tests against real databases
        run: go test -tags integration ./gorm/ -v -timeout 300s

  # End-to-end tests drive the assembled framework: a real server, the router, a
  # full middleware chain and real concurrent clients, plus fault injection for
  # aborted and slow requests. Two defects were found this way that no unit
  # test could see.
  e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: End-to-end and fault injection
        run: go test -tags e2e ./e2e/ -race -v -timeout 300s

  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/cmd/golangci-lint@latest

      - name: Run linter
        run: golangci-lint run ./...

  release:
    runs-on: ubuntu-latest
    needs: [test, submodules, integration, e2e, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build
        run: |
          GOOS=linux GOARCH=amd64 go build -o gofault-linux-amd64 ./cmd/gofault
          GOOS=darwin GOARCH=amd64 go build -o gofault-darwin-amd64 ./cmd/gofault
          GOOS=darwin GOARCH=arm64 go build -o gofault-darwin-arm64 ./cmd/gofault
          GOOS=windows GOARCH=amd64 go build -o gofault-windows-amd64.exe ./cmd/gofault

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            gofault-linux-amd64
            gofault-darwin-amd64
            gofault-darwin-arm64
            gofault-windows-amd64.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
